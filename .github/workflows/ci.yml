name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Flutter
        shell: bash
        env:
          FLUTTER_REVISION: ee80f08bbf97172ec030b8751ceab557177a34a6
        run: |
          flutter_dir="$RUNNER_TEMP/flutter"
          git init "$flutter_dir"
          git -C "$flutter_dir" remote add origin \
            https://github.com/flutter/flutter.git
          git -C "$flutter_dir" fetch --depth=1 origin "$FLUTTER_REVISION"
          git -C "$flutter_dir" checkout --detach FETCH_HEAD
          echo "$flutter_dir/bin" >> "$GITHUB_PATH"
          "$flutter_dir/bin/flutter" config --no-analytics
          "$flutter_dir/bin/flutter" --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Build Web release
        run: flutter build web --release
