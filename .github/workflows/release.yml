name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.44.6

      - name: Build APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          required=(
            ANDROID_KEYSTORE_BASE64
            ANDROID_KEYSTORE_PASSWORD
            ANDROID_KEY_ALIAS
            ANDROID_KEY_PASSWORD
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required Android signing secret: $name"
              exit 1
            fi
          done

          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG_NAME"
            exit 1
          fi

          keystore_path="$RUNNER_TEMP/steam-account-companion-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          export ANDROID_KEYSTORE_PATH="$keystore_path"
          trap 'rm -f "$keystore_path"' EXIT

          flutter pub get
          flutter build apk --release

          apk="build/app/outputs/flutter-apk/app-release.apk"
          apksigner="$(
            find "$ANDROID_HOME/build-tools" -type f -name apksigner \
              | sort -V \
              | tail -1
          )"
          if [[ -z "$apksigner" ]]; then
            echo "Android apksigner was not found."
            exit 1
          fi
          expected_cert="be2ac70368ae1ed1afe40f036834c1f98dde5868dd2603fdcc98d4c6001da191"
          actual_cert="$(
            "$apksigner" verify --print-certs "$apk" \
              | sed -n 's/^Signer #1 certificate SHA-256 digest: //p'
          )"
          if [[ "$actual_cert" != "$expected_cert" ]]; then
            echo "Unexpected Android signing certificate: $actual_cert"
            exit 1
          fi

          version="${TAG_NAME#v}"
          mkdir -p dist
          cp "$apk" \
            "dist/Steam-Account-Companion-${version}-android.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-android
          path: dist/*
          if-no-files-found: error

  build-macos:
    name: Build macOS
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.44.6

      - name: Build macOS app
        shell: bash
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG_NAME"
            exit 1
          fi
          flutter pub get
          flutter build macos --release
          version="${TAG_NAME#v}"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            "build/macos/Build/Products/Release/Steam Account Companion.app" \
            "dist/Steam-Account-Companion-${version}-macos.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-macos
          path: dist/*
          if-no-files-found: error

  build-ios-unsigned:
    name: Build unsigned iOS IPA
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.44.6

      - name: Build unsigned IPA
        shell: bash
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG_NAME"
            exit 1
          fi
          flutter clean
          flutter pub get
          flutter build ios --release --no-codesign
          app="build/ios/iphoneos/Runner.app"
          if codesign -dv "$app" >/dev/null 2>&1; then
            echo "Refusing to publish an unexpectedly signed iOS app."
            exit 1
          fi
          if [[ -e "$app/embedded.mobileprovision" ]]; then
            echo "Refusing to publish an embedded provisioning profile."
            exit 1
          fi
          version="${TAG_NAME#v}"
          mkdir -p package/Payload dist
          ditto "$app" package/Payload/Runner.app
          ditto -c -k --sequesterRsrc --keepParent package/Payload \
            "dist/Steam-Account-Companion-${version}-ios-unsigned.ipa"

      - name: Upload unsigned iOS artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-ios-unsigned
          path: dist/*
          if-no-files-found: error

  publish-draft:
    name: Update draft release
    needs:
      - build-android
      - build-macos
      - build-ios-unsigned
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate automated checksums
        shell: bash
        run: |
          cd dist
          sha256sum Steam-Account-Companion-* \
            > SHA256SUMS-automated.txt

      - name: Create or update draft
        shell: bash
        run: |
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TAG_NAME Alpha" \
              --generate-notes \
              --prerelease \
              --draft
          fi
