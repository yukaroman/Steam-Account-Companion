name: steam_account_companion
description: A local-first Steam Guard account companion for personal use.
publish_to: "none"
version: 0.1.1+2

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  crypto: ^3.0.7
  cryptography: ^2.9.0
  cupertino_icons: ^1.0.8
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^10.3.1
  http: ^1.6.0
  local_auth: ^3.0.2
  path: ^1.9.1
  path_provider: ^2.1.6
  pointycastle: ^4.0.0
  shared_preferences: ^2.5.5
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - LICENSE
